<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Capture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        cursor: crosshair;
      }
      #screenshot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #dim {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #selection {
        position: absolute;
        border: 1px solid #4ade80;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
        display: none;
        pointer-events: none;
      }
      #toolbar {
        position: absolute;
        display: none;
        gap: 6px;
      }
      #toolbar button {
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        background: #22c55e;
        color: #06290f;
        font-weight: 600;
      }
      #toolbar button.cancel {
        background: #6b7280;
        color: #fff;
      }
      #hint {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="screenshot" draggable="false" alt="" />
    <div id="dim"></div>
    <div id="selection"></div>
    <div id="toolbar">
      <button id="confirm">✓</button>
      <button id="cancel" class="cancel">✕</button>
    </div>
    <div id="hint"></div>
    <script type="module" src="./capture-main.ts"></script>
  </body>
</html>
